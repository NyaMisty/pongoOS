name: Build toolchain image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to pongo-tc)"
        required: false
        default: pongo-tc

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (for the Dockerfile)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/toolchain.Dockerfile
          push: true
          tags: |
            ghcr.io/nyamisty/pongo-tc:20.04

          cache-from: type=gha
          cache-to: type=gha,mode=max
