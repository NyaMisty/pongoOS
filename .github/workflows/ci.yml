name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
          image: ghcr.io/nyamisty/pongo-tc:20.04
          credentials:
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "--- which ld64"; ls -la /usr/bin/ld64; dpkg -S /usr/bin/ld64 || true
          echo "--- ld64 --version"; /usr/bin/ld64 -v 2>&1 | head -2 || true
          echo "--- ldd ld64"; ldd /usr/bin/ld64 2>&1 | head -8 || true
          echo "--- python dlopen test"
          python3 -c "import ctypes;
import glob
for p in ['/usr/lib/llvm-9/lib/libLTO.so','/usr/lib/llvm-10/lib/libLTO.so']:
    try:
        ctypes.CDLL(p); print('OK', p)
    except OSError as e: print('FAIL', p, e)"
          echo "--- go"
          EMBEDDED_CC=clang-10 EMBEDDED_AR=llvm-ar-10 EMBEDDED_RANLIB=llvm-ranlib-10 make all
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: PongoOS
          path: |
            build/checkra1n-kpf-pongo
            build/Pongo
            build/Pongo.bin
            build/PongoConsolidated.bin
