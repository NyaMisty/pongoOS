name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
          image: ghcr.io/nyamisty/pongo-tc:20.04
          credentials:
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "--- single-object straced link"
          clang-10 -c src/boot/stage3.c -o /tmp/s.o --target=arm64-apple-ios12.0 -std=gnu17 -O3 -flto -ffreestanding -U__nonnull -nostdlibinc -Inewlib/aarch64-none-darwin/include
          strace -f -e trace=openat,access -o /tmp/tr.log /usr/bin/ld64 -arch arm64 -o /tmp/out.bin -e _start /tmp/s.o 2>&1 | tail -5 || true
          echo "--- lto-relevant syscalls:"
          grep -iE "lto|\.so" /tmp/tr.log | grep -vE "ENOENT \(\?\) ld.so.cache" | tail -25
          echo "--- dlsym probe (lto_module_create etc.)"
          for L in /usr/lib/llvm-9/lib/libLTO.so /usr/lib/llvm-10/lib/libLTO.so; do LD_P="$L" python3 -c "import ctypes,os; lib=ctypes.CDLL(os.environ['LD_P']); syms=['lto_module_create','lto_module_is_object_file_for_target','lto_codegen_create']; print(os.environ['LD_P'], {s: (True if hasattr(lib,s) else False) for s in syms})"; done
          EMBEDDED_CC=clang-10 EMBEDDED_AR=llvm-ar-10 EMBEDDED_RANLIB=llvm-ranlib-10 make all
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: PongoOS
          path: |
            build/checkra1n-kpf-pongo
            build/Pongo
            build/Pongo.bin
            build/PongoConsolidated.bin
