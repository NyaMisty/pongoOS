name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: "ghcr.io/catthehacker/ubuntu:full-20.04"
    steps:
      - name: Install toolchain (clang-10 + ld64 on 20.04)
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -qy wget gnupg make git ca-certificates
          echo 'deb https://assets.checkra.in/debian /' > /etc/apt/sources.list.d/checkra1n.list
          wget -qO- https://assets.checkra.in/debian/archive.key | apt-key add -
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          echo 'deb http://apt.llvm.org/focal/ llvm-toolchain-focal-10 main' > /etc/apt/sources.list.d/llvm10.list
          apt-get update -q
          apt-get install -qy clang-10 llvm-10-dev libllvm10 ld64 cctools-strip
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          EMBEDDED_CC=clang-10 EMBEDDED_AR=llvm-ar-10 EMBEDDED_RANLIB=llvm-ranlib-10 make all
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: PongoOS
          path: |
            build/checkra1n-kpf-pongo
            build/Pongo
            build/Pongo.bin
            build/PongoConsolidated.bin
